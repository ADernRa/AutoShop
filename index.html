<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h1>AutoShop</h1>
            </div>
            <div class="info">
                <ul>
                    <li><a href="#">Товари</a></li>
                    <li><a href="#">Кабінет</a></li>
                    <li><a href="#">Контакти</a></li>
                    <li><a href="#" class="cart-link"><i class="fa-solid fa-basket-shopping"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class = "main-catalog">
            <div class="filter">
                <h2>Категорії</h2>
                <div class = "category">
                    <a>1. Автомобіль</a>
                    <a>1. Автомобіль</a>
                </div>
            </div>
            <div class="catalog">
                <h2>Каталог товарів</h2>
                <div class="items">
                    <div class="card-item">
                        <img src="test.jpg" alt="Товар" class="card-image">
                        <h3 class="card-title">Машинка Mini Cooper</h3>
                        <div class="card-price">12 500 ₽</div>
                        <button class="card-button">В корзину</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
    </footer>

    <script src="script.js"></script>
</body>
</html>
