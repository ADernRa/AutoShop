<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h1>AutoShop</h1>
            </div>
            <div class="info">
                <ul>
                    <li><a href="#">Каталог</a></li>
                    <li><a href="#" class="user-link"><i class="fa-solid fa-user"></i></a></li>
                    <li><a href="#" class="cart-link"><i class="fa-solid fa-basket-shopping"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="cart-overlay"></div>

        <div class="cart-login">
            <div class="login-window">
                <div class="title-login">
                    <h2>Вхід до акаунту</h2>
                    <button class="close-btn-login">&times;</button>
                </div>
                <div class ="input-login">
                    <div class="login-conteiner">
                        <i class="fa-solid fa-user login-icon"></i>
                        <div class="login-input">
                            <label>Логін</label>
                            <input class="login" type="text">
                        </div>
                    </div>
                    <div class="login-conteiner">
                        <i class="fa-solid fa-lock login-icon"></i>
                        <div class="login-input">
                            <label>Пароль</label>
                            <input class="password" type="password">
                        </div>
                        <button class="eye close"><i class="fa-solid fa-eye-slash close-eye"></i><i class="fa-solid fa-eye open-eye"></i></button>
                    </div>
                </div>
                <div class ="login-button">
                    <button class="login-but">Увійти </button>
                    <button class="register-but">Реєстрація</button>
                </div>
            </div>

            <div class="register-window">
                <div class="title-login">
                    <h2>Реєстрація</h2>
                    <button class="close-btn-register">&times;</button>
                </div>
                <div class ="input-login">
                    <div class="login-conteiner">
                        <i class="fa-solid fa-user login-icon"></i>
                        <div class="login-input">
                            <label>Логін</label>
                            <input class="new-login" type="text">
                        </div>
                    </div>
                    <div class="login-conteiner">
                        <i class="fa-solid fa-lock login-icon"></i>
                        <div class="login-input">
                            <label>Пароль</label>
                            <input class="new-password" type="password">
                        </div>
                    </div>
                    <div class="login-conteiner">
                        <i class="fa-solid fa-lock login-icon"></i>
                        <div class="login-input">
                            <label>Повторіть пароль</label>
                            <input class="new-password-two" type="password">
                        </div>
                    </div>
                </div>
                <div class ="login-button">
                    <button class="register-but-next">Продовжити</button>
                </div>
            </div>
        </div>
        
        <div id="cart-sidebar" class="cart-sidebar">
            <div class="cart-header">
                <h2>Кошик</h2>
                <button id="close-cart-btn" class="close-btn">&times;</button>
            </div>
            
            <div class="cart-content">
                <p>Ваш кошик порожній.</p>
            </div>
            
            <div class="cart-footer">
                <button class="checkout-btn">Оформити замовлення</button>
            </div>
        </div>

        <section class = "main-catalog">
            <div class="filter">
                <h2>Пошук по:</h2>
                <div class = "search-for">
                    <p>Ціна:</p>
                    <div class="serch-cost">
                        <input id="min-cost" type="number" value="0">
                        <p>-</p>
                        <input id="max-cost" type="number" value="99999">
                    </div>
                    <div class="search-promotions">
                        <p>Акційний товар</p>
                        <input type="checkbox" id="promotions">
                    </div>
                </div>
                <h2>Категорії</h2>
                <div class = "category">
                    <button class="category-btn active-category" data-category="all">Всі товари</button>
                    <button class="category-btn" data-category="cars">Автомобілі</button>
                    <button class="category-btn" data-category="engines">Двигуни</button>
                    <button class="category-btn" data-category="wheels">Колеса</button>
                    <button class="category-btn" data-category="chassis">Ходова та підвіска</button>
                    <button class="category-btn" data-category="tools">Інструменти</button>
                    <button class="category-btn" data-category="filters">Фільтри</button>
                    <button class="category-btn" data-category="automotive-chemicals">Автохімія</button>
                    <button class="category-btn" data-category="gadgets">Гаджети</button>
                    <button class="category-btn" data-category="comfort-interior">Комфорт салон</button>
                </div>
            </div>
            <div class="catalog">
                <h2>Каталог товарів</h2>
                <div class="items">
                    <div class="card-item" data-id="1">
                        <img src="test.jpg" alt="Товар" class="card-image">
                        <h3 class="card-title">Машинка Mini Cooper</h3>
                        <div class="card-price-count">
                            <div class="card-price"><p>12500</p> грн.</div>
                            <div class="card-count"><p>3</p> шт.</div>
                        </div>
                        <button class="card-button">До кошику</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
    </footer>

    <script src="scripts/auth.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/products.js"></script>
    <script src="scripts/basket.js"></script>
</body>
</html>
