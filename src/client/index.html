<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h1>AutoShop</h1>
            </div>
            <div class="info">
                <ul>
                    <li class="active-info"><a href="#">Товари</a></li>
                    <li><a href="#">Кабінет</a></li>
                    <li><a href="#">Контакти</a></li>
                    <li><a href="#" class="cart-link"><i class="fa-solid fa-basket-shopping"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class = "main-catalog">
            <div class="filter">
                <h2>Пошук по:</h2>
                <div class = "search-for">
                    <p>Ціна:</p>
                    <div class="serch-cost">
                        <input id="min-cost" type="number" value="0">
                        <p>-</p>
                        <input id="max-cost" type="number" value="99999">
                    </div>
                    <div class="search-promotions">
                        <p>Акційний товар</p>
                        <input type="checkbox">
                    </div>
                </div>
                <h2>Категорії</h2>
                <div class = "category">
                    <button class="category-btn active-category" data-category="all">Всі товари</button>
                    <button class="category-btn" data-category="cars">Автомобілі</button>
                    <button class="category-btn" data-category="engines">Двигуни</button>
                    <button class="category-btn" data-category="wheels">Колеса</button>
                    <button class="category-btn" data-category="chassis">Ходова та підвіска</button>
                    <button class="category-btn" data-category="tools">Інструменти</button>
                    <button class="category-btn" data-category="filters">Фільтри</button>
                    <button class="category-btn" data-category="automotive-chemicals">Автохімія</button>
                    <button class="category-btn" data-category="gadgets">Гаджети</button>
                    <button class="category-btn" data-category="comfort-interior">Комфорт салон</button>
                </div>
            </div>
            <div class="catalog">
                <h2>Каталог товарів</h2>
                <div class="items">
                    <div class="card-item" data-id="1">
                        <img src="test.jpg" alt="Товар" class="card-image">
                        <h3 class="card-title">Машинка Mini Cooper</h3>
                        <div class="card-price">12 500 ₽</div>
                        <button class="card-button">В корзину</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
    </footer>

    <script src="script.js"></script>
</body>
</html>
